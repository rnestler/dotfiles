# Solarized Light theme (mirrors config/alacritty/alacritty.toml)

# Primary
background           #fdf6e3
foreground           #586e75

# Cursor
cursor               #586e75
cursor_text_color    background

# Selection
selection_background #eee8d5
selection_foreground #586e75

# Normal colors
color0  #073642
color1  #dc322f
color2  #859900
color3  #b58900
color4  #268bd2
color5  #d33682
color6  #2aa198
color7  #eee8d5

# Bright colors
color8  #002b36
color9  #cb4b16
color10 #586e75
color11 #657b83
color12 #839496
color13 #6c71c4
color14 #93a1a1
color15 #fdf6e3

# Keybindings (match alacritty)
map ctrl+alt+c copy_to_clipboard
map ctrl+alt+v paste_from_clipboard
